name: Protein Gln-Glu correction audit

on:
  push:
    branches:
      - protein-rerun-gln-glu-20260916
  workflow_dispatch:

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install freesasa biopython pandas numpy requests
      - name: Recompute old and corrected protein surface descriptors
        run: python audit_rerun/protein_surface_gln_glu_correction.py
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protein-gln-glu-correction-audit
          path: audit_rerun/output/
          if-no-files-found: error
